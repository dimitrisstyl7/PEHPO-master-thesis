name: ci

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "scripts/generate_docs/**"
      - "requirements.in"
      - "requirements.txt"
      - ".github/workflows/**"
      - "mypy.ini"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "scripts/generate_docs/**"
      - "requirements.in"
      - "requirements.txt"
      - ".github/workflows/**"
      - "mypy.ini"
  workflow_dispatch:

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  docs:
    needs: lint
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
